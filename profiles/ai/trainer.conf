# /etc/dotfiles-aro.minimal.d/ai-trainer.conf -- profil ai, bagian "trainer"
# (train-run + Detectron2). Dibuat sekali dari profiles/ai/trainer.conf; update.sh
# tidak menimpanya. Aktif kalau AI_PARTS di config mesin memuat "trainer".
AI_BACKEND="auto"           # auto | cuda | cpu   (auto: nvidia -> cuda; cpu = Detectron2 dilewati)
TORCH_CUDA_ARCH="12.0"      # RTX 50xx (Blackwell) = 12.0; RTX 40xx = 8.9; RTX 30xx = 8.6
D2_REV=""                   # commit Detectron2; kosong = terbaru (origin/main)
TORCH_INDEX=""              # kosong = otomatis dari nvcc; paksa mis. https://download.pytorch.org/whl/cu130
