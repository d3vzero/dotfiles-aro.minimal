# /etc/dotfiles-aro.minimal.d/ai-llm.conf -- profil ai, bagian "llm"
# (llama.cpp + perintah llm + OpenCode). Dibuat sekali dari profiles/ai/llm.conf;
# update.sh tidak menimpanya. Aktif kalau AI_PARTS di config mesin memuat "llm".
LLAMA_REF="b11400"          # tag/commit github.com/ggml-org/llama.cpp yang dibangun (dikunci)
LLAMA_CUDA_ARCH="120"       # sm_120 = RTX 50xx; 89 = RTX 40xx; 86 = RTX 30xx
OPENCODE_VERSION="1.18.34"  # npm opencode-ai (dikunci)
LLM_VRAM_MB="14000"         # VRAM yang boleh dipakai model; sisanya (expert MoE) di RAM
LLM_CTX="32768"             # context (token)
LLM_PORT="8080"             # llama-server di 127.0.0.1:<port>, API kompatibel OpenAI
LLM_MODEL=""                # file .gguf di ~/models; kosong = yang terbaru di sana
