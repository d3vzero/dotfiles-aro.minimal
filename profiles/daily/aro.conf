# === profil daily ===
exec = sung-yt watch
rule = app_id:sung  no_header      # Sung punya bar sendiri

# Game Steam/Proton: semua jendela game (termasuk dialog login) di workspace 4,
# supaya game fullscreen tidak menutupi aplikasi lain (Super+Tab pindah workspace).
rule = app_id:steam_app_*  workspace 4
# Game yang di mode "Windowed" tidak bisa fullscreen sendiri: aro yang
# menjadikannya fullscreen (dipertahankan oleh patch 0004). Tambah per game:
# rule = app_id:steam_app_<ID>  type:normal  fullscreen   (ID = angka di URL Steam)
rule = app_id:steam_app_3513350  type:normal  fullscreen   # Wuthering Waves
