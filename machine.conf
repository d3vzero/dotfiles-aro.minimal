# machine.conf -- setting per mesin dotfiles-aro.minimal.
# JANGAN edit file ini di repo. Copy ke /etc/dotfiles-aro.minimal.conf lalu
# edit di sana (lihat docs/INSTALL.md). bootstrap & update.sh membaca /etc.

HOST_NAME="MS-PC"
ADMIN_USER="Admin"          # grup wheel, punya password, bisa sudo
PUBLIC_USER="Assy"          # tanpa password, tanpa sudo, autologin tty1
                            # workstation AI: mis. "AI-Trainer"

# Profil di atas core, pisah spasi: office cad daily ai
#   PC kantor       : "office cad"
#   workstation AI  : "office ai"
PROFILES="office cad"

# --- hardware (divalidasi terhadap deteksi; tidak diganti diam-diam) ---
CPU="amd"                   # amd | intel
GPU="amd"                   # amd | nvidia | intel | vm
GPU_GEN="new"               # hanya untuk GPU=intel: new (Broadwell+) | old (Haswell ke bawah)

# --- profil ai (Detectron2 hanya untuk GPU NVIDIA) ---
AI_BACKEND="auto"           # auto | cuda | cpu   (auto: nvidia -> cuda; cpu = Detectron2 dilewati)
TORCH_CUDA_ARCH="12.0"      # RTX 50xx (Blackwell) = 12.0; RTX 40xx = 8.9; RTX 30xx = 8.6
D2_REV=""                   # commit Detectron2; kosong = terbaru (origin/main)
TORCH_INDEX=""              # kosong = otomatis dari nvcc; paksa mis. https://download.pytorch.org/whl/cu130

# --- tmpfs (kurangi tulis ke NVMe; berlaku setelah reboot) ---
TMPFS_TMP_SIZE="50%"        # /tmp -- dataset SH Trainer di-copy ke sini
TMPFS_CACHE_SIZE="2G"       # ~/.cache user umum (workstation AI: 4G)

AUTOLOGIN="yes"             # autologin PUBLIC_USER di tty1
ENABLE_SSH="no"             # yes: pasang openssh + aktifkan sshd
ENABLE_BLUETOOTH="no"       # yes: pasang bluez + bluetui, aktifkan bluetoothd, bind Super+B
# Menu Pengaturan -> Monitor. Kosong = semua mode yang dilaporkan monitor.
# Mode yang tidak ada di daftar monitor dipasang sebagai custom mode (bisa ditolak
# monitor; layar kembali otomatis setelah 15 detik tanpa konfirmasi).
MONITOR_OUTPUT=""          # kosong = output aktif pertama (mis. DP-3)
MONITOR_MODES=""           # mis. "2560x1600@60 2560x1600@240 2560x1440@60 2560x1440@240"
TIMEZONE="Asia/Jakarta"
EFI_LABEL="Artix"           # nama entry EFISTUB di menu boot BIOS

ARO_REF="v0.4.0"            # kosong = branch default aro; isi tag/commit yang sudah diuji
SPF_VERSION="1.6.0"         # versi superfile
SUNG_REV="4918f76"          # commit Sung yang sudah dites (profil daily)
