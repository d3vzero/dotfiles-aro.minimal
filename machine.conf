# machine.conf -- setting per mesin dotfiles-aro.minimal.
# JANGAN edit file ini di repo. Copy ke /etc/dotfiles-aro.minimal.conf lalu edit
# di sana (lihat docs/INSTALL.md). bootstrap & update.sh membaca /etc.

HOST_NAME="MS-PC"
ADMIN_USER="Admin"          # grup wheel, punya password, bisa sudo
PUBLIC_USER="Assy"          # tanpa password, tanpa sudo, autologin tty1

# Profil tambahan di atas core, pisah spasi: daily work ai
PROFILES="work"

IS_VM="auto"                # auto | yes | no  (yes: tanpa amd-ucode, fix kursor virtio, core dump on)
AUTOLOGIN="yes"             # autologin PUBLIC_USER di tty1
ENABLE_SSH="no"             # yes: pasang openssh + aktifkan sshd
TIMEZONE="Asia/Jakarta"
EFI_LABEL="Artix"           # nama entry EFISTUB di menu boot BIOS

ARO_REF="v0.4.0"                  # kosong = branch default aro; isi tag/commit yang sudah diuji
SPF_VERSION="1.6.0"         # versi superfile
