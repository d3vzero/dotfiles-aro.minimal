# === tambahan dotfiles-aro.minimal (ditempel di akhir config.example) ===
exec = pipewire
exec = wireplumber
exec = pipewire-pulse
exec = mako
exec = udiskie --no-tray --notify
exec = monitor-mode restore
# layout default = scroll (diganti di config.example oleh setup_public_home);
# kolom yang difokus (termasuk jendela baru) selalu di tengah layar.
# scroll_center = patch lokal core/patches/aro/0001-scroll-center.patch
scroll_center = true
bind = ctrl+alt+Delete, spawn, powermenu
bind = mod+e, spawn, kitty -e spf
bind = mod+n, spawn, kitty -e nmtui
bind = mod+shift+c, spawn, cheatsheet
bind = mod+shift+s, spawn, screenshot
bind = mod+shift+r, spawn, casual-record
# media & volume: tombol multimedia keyboard + alternatif Super (media-key)
bind = XF86AudioPlay, spawn, media-key play
bind = XF86AudioPause, spawn, media-key play
bind = XF86AudioNext, spawn, media-key next
bind = XF86AudioPrev, spawn, media-key prev
bind = XF86AudioStop, spawn, media-key stop
bind = XF86AudioRaiseVolume, spawn, media-key up
bind = XF86AudioLowerVolume, spawn, media-key down
bind = XF86AudioMute, spawn, media-key mute
bind = mod+p, spawn, media-key play
bind = mod+bracketright, spawn, media-key next
bind = mod+bracketleft, spawn, media-key prev
bind = mod+shift+p, spawn, media-key stop
bind = mod+F12, spawn, media-key up
bind = mod+F11, spawn, media-key down
bind = mod+F10, spawn, media-key mute
bind = mod+u, spawn, office-update menu
bind = mod+ctrl+u, spawn, office-update all
rule = app_id:office-update  float  size 1000 650  center
